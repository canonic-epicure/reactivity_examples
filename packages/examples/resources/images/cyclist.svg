<svg xmlns="http://www.w3.org/2000/svg" width="440" height="290" viewBox="0 0 440 290" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
    <title>Happy cycling!</title>

    <defs>
        <marker id="cyclist-arrow-amount" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A9396"/>
        </marker>
        <marker id="cyclist-arrow-quantity" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#CA6702"/>
        </marker>
    </defs>

    <rect width="440" height="290" fill="#FFFFFF"/>

    <!-- speed lines -->
    <g stroke="#94D2BD" stroke-width="3" stroke-linecap="round">
        <line x1="12" y1="120" x2="42" y2="120"/>
        <line x1="22" y1="145" x2="46" y2="145"/>
        <line x1="8" y1="170" x2="40" y2="170"/>
    </g>

    <!-- ground -->
    <line x1="30" y1="252" x2="410" y2="252" stroke="#5C6B70" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8"/>

    <!-- wheels -->
    <g fill="none" stroke="#005F73">
        <circle cx="115" cy="195" r="55" stroke-width="5"/>
        <circle cx="315" cy="195" r="55" stroke-width="5"/>
        <circle cx="115" cy="195" r="4" fill="#005F73" stroke-width="0"/>
        <circle cx="315" cy="195" r="4" fill="#005F73" stroke-width="0"/>
    </g>

    <!-- the cycle in the wheels -->
    <g fill="none" stroke-width="3" stroke-linecap="round">
        <path d="M 115 159 A 36 36 0 1 1 79 195" stroke="#0A9396" marker-end="url(#cyclist-arrow-amount)"/>
        <path d="M 315 159 A 36 36 0 1 1 279 195" stroke="#CA6702" marker-end="url(#cyclist-arrow-quantity)"/>
    </g>
    <g font-size="14" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">
        <text x="115" y="278" fill="#0A9396">amount</text>
        <text x="315" y="278" fill="#CA6702">quantity</text>
    </g>

    <!-- frame -->
    <g fill="none" stroke="#CA6702" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="115,195 200,195 172,110 115,195"/>
        <line x1="172" y1="110" x2="287" y2="105"/>
        <line x1="200" y1="195" x2="293" y2="125"/>
        <line x1="283" y1="92" x2="315" y2="195"/>
        <line x1="172" y1="110" x2="167" y2="94"/>
    </g>

    <!-- saddle and handlebar -->
    <g stroke="#001219" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="150" y1="91" x2="182" y2="91" stroke-width="7"/>
        <path d="M 283 92 L 290 78 Q 306 74 304 90" stroke-width="5"/>
    </g>

    <!-- crank and pedals -->
    <g stroke="#001219" stroke-width="4" stroke-linecap="round">
        <line x1="185" y1="172" x2="215" y2="218"/>
        <line x1="177" y1="172" x2="193" y2="172"/>
        <line x1="207" y1="218" x2="223" y2="218"/>
    </g>
    <circle cx="200" cy="195" r="9" fill="#FFFFFF" stroke="#001219" stroke-width="3"/>

    <!-- rider -->
    <g fill="none" stroke="#001219" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <!-- back leg -->
        <polyline points="168,84 205,128 185,172" stroke="#3A4A50"/>
        <!-- front leg -->
        <polyline points="168,84 228,140 215,218"/>
        <!-- torso -->
        <line x1="168" y1="84" x2="238" y2="46"/>
        <!-- arm -->
        <polyline points="238,48 268,70 298,80" stroke-width="7"/>
    </g>

    <!-- head with helmet -->
    <circle cx="255" cy="28" r="15" fill="#001219"/>
    <path d="M 238 26 A 19 19 0 0 1 274 20 L 280 26 Z" fill="#0A9396"/>
</svg>
