<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="Lato, 'Helvetica Neue', Arial, sans-serif">
    <title>Quoting tool: amount is calculated from price, quantity and discount</title>

    <defs>
        <marker id="arrow-amount" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A9396"/>
        </marker>
    </defs>

    <rect width="680" height="430" fill="#FFFFFF"/>

    <!-- edges of the `amount` formula: amount reads price, quantity, discount -->
    <g stroke="#0A9396" stroke-width="2.5" fill="none" marker-end="url(#arrow-amount)">
        <line x1="215" y1="84" x2="423" y2="168"/>
        <line x1="215" y1="190" x2="423" y2="190"/>
        <line x1="215" y1="296" x2="423" y2="212"/>
    </g>

    <!-- nodes -->
    <g font-size="20" text-anchor="middle" fill="#001219">
        <rect x="65" y="42" width="150" height="56" rx="28" fill="#FFFFFF" stroke="#005F73" stroke-width="3"/>
        <text x="140" y="77">price</text>

        <rect x="65" y="162" width="150" height="56" rx="28" fill="#FFFFFF" stroke="#005F73" stroke-width="3"/>
        <text x="140" y="197">quantity</text>

        <rect x="65" y="282" width="150" height="56" rx="28" fill="#FFFFFF" stroke="#005F73" stroke-width="3"/>
        <text x="140" y="317">discount</text>

        <rect x="425" y="162" width="150" height="56" rx="28" fill="#E6F4F1" stroke="#0A9396" stroke-width="3"/>
        <text x="500" y="197">amount</text>
    </g>

    <text x="500" y="244" font-size="14" text-anchor="middle" fill="#5C6B70" font-style="italic">calculated, read-only</text>

    <!-- formula -->
    <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14">
        <line x1="40" y1="378" x2="72" y2="378" stroke="#0A9396" stroke-width="2.5"/>
        <text x="84" y="383" fill="#0A9396">amount = price × quantity × (1 − discount / 100)</text>
    </g>

    <text x="40" y="414" font-size="13" fill="#5C6B70">A → B : field B reads field A</text>
</svg>
